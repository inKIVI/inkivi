<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>inkivi admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b0b08;--card:#12120f;--ink:#e8e0d2;--muted:#8f887c;--line:#34332d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1080px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}h1{font-size:clamp(34px,7vw,64px);line-height:.9;margin:0;letter-spacing:-.06em}h2{margin:0 0 12px;font-size:18px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{border:1px solid var(--line);padding:18px;background:var(--card)}input,button,select{width:100%;padding:11px;margin:6px 0;background:#0d0d0b;color:var(--ink);border:1px solid #3a3933;font:inherit}button{cursor:pointer}.primary{background:var(--ink);color:#11110e}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.item{border-top:1px solid var(--line);padding:12px 0}.tiny{font-size:11px}.status{margin:8px 0 0;min-height:20px}.danger{border-color:#69433b}.pill{display:inline-block;border:1px solid var(--line);padding:4px 7px;font-size:10px;margin:2px}.top button{width:auto;margin:0}.preview{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;margin:10px 0;padding:10px;border:1px solid var(--line);background:#0d0d0b}.preview img{width:92px;height:92px;object-fit:cover;background:#080806}.preview .ph{width:92px;height:92px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}.deleteSmall{margin-top:8px;padding:8px;width:auto;min-width:100px}a{color:inherit}@media(max-width:620px){main{padding:16px}.row{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><main><div class="top"><div><h1>inkivi / admin</h1><div class="muted tiny">закрытая панель управления сайтом</div></div><button id="logout" class="hidden">выйти</button></div><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" autocomplete="username" placeholder="email"><input id="password" type="password" autocomplete="current-password" placeholder="пароль"><button id="loginBtn" class="primary">войти</button><div id="loginStatus" class="status muted"></div></section><div id="app" class="hidden"><div class="grid"><section class="card"><h2>Главная</h2><p class="muted">Ближайший будущий релиз, иначе последний вышедший.</p><div id="currentRelease">нет данных</div></section><section class="card"><h2>Добавить / обновить релиз</h2><input id="source" placeholder="BandLink / Spotify / Apple Music"><button id="fetchRelease">подтянуть всё автоматически</button><div id="releasePreview" class="preview hidden"></div><div class="row"><input id="title" placeholder="название"><select id="type"><option value="single">single</option><option value="ep">EP</option><option value="album">album</option></select></div><input id="releaseDate" type="datetime-local"><input id="cover" placeholder="ссылка на обложку"><input id="presave" placeholder="presave / smart-link"><input id="soundcloud" placeholder="SoundCloud URL — для полного проигрывания"><button id="saveRelease" class="primary">сохранить релиз</button><div id="releaseStatus" class="status muted"></div></section><section class="card"><h2>Релизы</h2><div id="releaseList" class="muted">загрузка…</div></section><section class="card"><h2>Визуалы</h2><button id="importTikTokAccount" class="primary">импортировать весь TikTok-аккаунт</button><div id="tiktokImportStatus" class="status muted tiny"></div><input id="visualUrl" placeholder="TikTok / YouTube URL"><button id="fetchVisual">подтянуть данные</button><div id="visualPreview" class="preview hidden"></div><input id="visualTitle" placeholder="название"><select id="visualPlatform"><option value="tiktok">TikTok</option><option value="youtube">YouTube</option><option value="other">Другое</option></select><input id="visualPreviewUrl" placeholder="preview URL"><button id="saveVisual">добавить визуал</button><div id="visualList" class="muted"></div></section></div></div></main><script>
const SUPABASE_URL='https://ytckdpaegunralpxvmlx.supabase.co',SUPABASE_KEY='sb_publishable_oyJmCk-WH3ig_QTJlJh1vQ_wLICx0X0',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
const PLATFORM_ORDER=['spotify','apple','yandex','vk','youtube','soundcloud','deezer','tidal','amazon','bandcamp'];
const PLATFORM_RULES={spotify:'a[href*="open.spotify.com"]',apple:'a[href*="music.apple.com"]',yandex:'a[href*="music.yandex"]',vk:'a[href*="vk.com/audio"],a[href*="vk.com/music"],a[href*="boom.ru"]',youtube:'a[href*="youtube.com"],a[href*="youtu.be/"]',soundcloud:'a[href*="soundcloud.com"]',deezer:'a[href*="deezer.com"]',tidal:'a[href*="tidal.com"]',amazon:'a[href*="music.amazon"]',bandcamp:'a[href*="bandcamp.com"]'};
let releasePlatforms={},releaseTracklist=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').toLowerCase().replace(/^inkivi\s*[-—–:]\s*/i,'').replace(/[^a-zа-яё0-9]+/gi,' ').trim();
const cleanTitle=s=>String(s||'').replace(/\s*[|—-]\s*(BandLink|RPLUS|RPlus).*$/i,'').trim();
const badTitle=s=>{s=cleanTitle(s);return !s||/^(band\.?link|link)$/i.test(s)||(/^[a-z0-9_-]{4,12}$/i.test(s)&&!/[а-яё ]/i.test(s))};
const badImage=u=>!u||/favicon|gstatic|googleusercontent.*favicon|\/icon/i.test(String(u));
function localDateInput(v){const d=new Date(v);if(!Number.isFinite(d.getTime()))return'';const z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
async function metadata(url){const q=new URLSearchParams({url});q.set('data.ogTitle.selector','meta[property="og:title"]');q.set('data.ogTitle.type','attr');q.set('data.ogTitle.attr','content');q.set('data.ogImage.selector','meta[property="og:image"]');q.set('data.ogImage.type','attr');q.set('data.ogImage.attr','content');for(const[k,sel]of Object.entries(PLATFORM_RULES)){q.set(`data.${k}.selector`,sel);q.set(`data.${k}.type`,'attr');q.set(`data.${k}.attr`,'href')}const r=await fetch('https://api.microlink.io/?'+q);if(!r.ok)throw Error('metadata');return(await r.json()).data||{}}
async function soundcloudMatches(url,title){if(!url||!title)return false;try{const r=await fetch('https://soundcloud.com/oembed?format=json&url='+encodeURIComponent(url));if(!r.ok)return false;const d=await r.json(),a=norm(d.title||''),b=norm(title);return !!(a&&b&&(a===b||a.includes(b)||b.includes(a)))}catch{return false}}
async function lookup(id,country='US'){const r=await fetch('https://itunes.apple.com/lookup?'+new URLSearchParams({id:String(id),entity:'song',country}));if(!r.ok)return null;const rows=(await r.json()).results||[];return{collection:rows.find(x=>x.wrapperType==='collection'),tracks:rows.filter(x=>x.wrapperType==='track')}}
function appleId(url){const u=String(url||'');const qi=u.match(/[?&]i=(\d+)/i)||u.match(/[?&]id=(\d+)/i),path=[...u.matchAll(/\/(\d{6,})(?:[/?#]|$)/g)].pop();return(qi&&qi[1])||(path&&path[1])||''}
async function collectionFromApple(url){const id=appleId(url);if(!id)return null;for(const country of['US','RU','GB']){const first=await lookup(id,country);if(!first)continue;if(first.tracks.length>1)return first;const song=first.tracks[0];if(song?.collectionId){const full=await lookup(song.collectionId,country);if(full?.tracks?.length)return full}}return null}
async function searchApple(title){if(!title||badTitle(title))return null;for(const country of['US','RU','GB']){const r=await fetch('https://itunes.apple.com/search?'+new URLSearchParams({term:`inkivi ${norm(title)}`,entity:'song',limit:'50',country}));if(!r.ok)continue;const rows=(await r.json()).results||[],needle=norm(title),hit=rows.find(x=>norm(x.artistName)==='inkivi'&&(norm(x.trackName)===needle||norm(x.collectionName)===needle))||rows.find(x=>norm(x.artistName)==='inkivi');if(hit?.collectionId){const full=await lookup(hit.collectionId,country);if(full?.tracks?.length)return full}if(hit)return{collection:null,tracks:[hit]}}return null}
function applyApple(out){if(!out)return;const c=out.collection,t=out.tracks||[],first=t[0];releaseTracklist=t.map((x,i)=>({title:x.trackName||`трек ${i+1}`,preview:x.previewUrl||'',duration:x.trackTimeMillis||0,number:x.trackNumber||i+1}));const title=c?.collectionName||(t.length===1?first?.trackName:'');if(title)$('title').value=title;const art=(c?.artworkUrl100||first?.artworkUrl100||'').replace('100x100bb','600x600bb');if(art&&!badImage(art)){$('cover').value=art;releasePlatforms.artwork=art}const date=c?.releaseDate||first?.releaseDate;if(date)$('releaseDate').value=localDateInput(date);if(c?.collectionViewUrl)releasePlatforms.apple=c.collectionViewUrl;else if(first?.trackViewUrl)releasePlatforms.apple=first.trackViewUrl;if(first?.previewUrl)releasePlatforms.preview=first.previewUrl;const n=releaseTracklist.length;$('type').value=n>1?(n<=6?'ep':'album'):'single'}
function resetReleaseFields(){releasePlatforms={};releaseTracklist=[];$('title').value='';$('releaseDate').value='';$('cover').value='';$('presave').value='';$('soundcloud').value='';$('type').value='single'}
async function enrichRelease(){const u=$('source').value.trim();if(!u)return null;const manualSC=$('soundcloud').value.trim();releasePlatforms={};releaseTracklist=[];let d={};try{d=await metadata(u)}catch{}for(const k of PLATFORM_ORDER){const v=d[k];if(v)releasePlatforms[k]=typeof v==='string'?v:v.url||''}if(manualSC)releasePlatforms.soundcloud=manualSC;$('soundcloud').value=releasePlatforms.soundcloud||manualSC;let title=cleanTitle(d.ogTitle||d.title||'');if(!badTitle(title))$('title').value=title;let img=d.ogImage||d.image?.url||'';if(!badImage(img))$('cover').value=img;if(!$('presave').value)$('presave').value=u;let apple=null;if(releasePlatforms.apple)apple=await collectionFromApple(releasePlatforms.apple);if(!apple)apple=await searchApple($('title').value.trim());if(apple)applyApple(apple);if(manualSC){releasePlatforms.soundcloud=manualSC;$('soundcloud').value=manualSC}else if(releasePlatforms.soundcloud){const parsedSC=releasePlatforms.soundcloud;const ok=await soundcloudMatches(parsedSC,$('title').value.trim());if(ok)$('soundcloud').value=parsedSC;else{delete releasePlatforms.soundcloud;$('soundcloud').value=''}}return apple}
function showPreview(){const title=$('title').value.trim(),img=$('cover').value,count=releaseTracklist.length,e=$('releasePreview');e.classList.remove('hidden');e.innerHTML=(img&&!badImage(img)?`<img src="${esc(img)}" alt="" onerror="this.style.display='none'">`:`<div class="ph">no image</div>`)+`<div><b>${esc(title||'данные не найдены')}</b><div class="muted tiny">${esc(count>1?`${$('type').value} · ${count} треков`:'single')} · ${esc(PLATFORM_ORDER.filter(k=>releasePlatforms[k]).join(' · '))}</div></div>`}
async function setSessionUI(){const{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('logout').classList.toggle('hidden',!session);if(session){loadReleases();loadVisuals()}}
$('loginBtn').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=error?error.message:'готово';if(!error)setSessionUI()};$('logout').onclick=async()=>{await db.auth.signOut();setSessionUI()};
$('fetchRelease').onclick=async()=>{$('releaseStatus').textContent='загружаю…';const source=$('source').value.trim(),manualSC=$('soundcloud').value.trim();resetReleaseFields();$('source').value=source;$('soundcloud').value=manualSC;await enrichRelease();showPreview();if(!$('title').value)$('releaseStatus').textContent='не удалось определить релиз — пришли прямую Apple Music / Spotify ссылку';else $('releaseStatus').textContent=releaseTracklist.length>1?`готово · ${releaseTracklist.length} треков${releasePlatforms.soundcloud?' · SoundCloud full':''}`:`данные подтянуты${releasePlatforms.soundcloud?' · SoundCloud full':''}`};
$('saveRelease').onclick=async()=>{$('releaseStatus').textContent='проверяю релиз…';const manualTitle=$('title').value.trim(),manualSC=$('soundcloud').value.trim(),manualDate=$('releaseDate').value,manualCover=$('cover').value.trim(),manualPresave=$('presave').value.trim();await enrichRelease();if(manualTitle)$('title').value=manualTitle;if(manualDate)$('releaseDate').value=manualDate;if(manualCover)$('cover').value=manualCover;if(manualPresave)$('presave').value=manualPresave;if(manualSC){releasePlatforms.soundcloud=manualSC;$('soundcloud').value=manualSC}const title=$('title').value.trim(),date=$('releaseDate').value,source=$('source').value.trim();if(!title||!date){$('releaseStatus').textContent='не удалось определить название/дату — сначала нажми «подтянуть всё автоматически»';return}const n=releaseTracklist.length,type=n>1?(n<=6?'ep':'album'):'single';$('type').value=type;const payload={title,slug:title.toLowerCase().trim().replace(/[^a-zа-я0-9]+/gi,'-').replace(/^-|-$/g,''),release_date:new Date(date).toISOString(),type,cover_url:!badImage($('cover').value.trim())?$('cover').value.trim():releasePlatforms.artwork||null,source_url:source||null,presave_url:$('presave').value.trim()||source||null,platforms:releasePlatforms,tracklist:releaseTracklist,published:true};let error=null;if(source){const{data:existing}=await db.from('releases').select('id').eq('source_url',source).limit(1).maybeSingle();if(existing?.id){({error}=await db.from('releases').update(payload).eq('id',existing.id))}else({error}=await db.from('releases').upsert(payload,{onConflict:'slug'}))}else({error}=await db.from('releases').upsert(payload,{onConflict:'slug'}));$('releaseStatus').textContent=error?error.message:`сохранено · ${type}${n>1?` · ${n} треков`:''}${releasePlatforms.soundcloud?' · SoundCloud full':''}`;if(!error){showPreview();loadReleases()}};
async function loadReleases(){const{data,error}=await db.from('releases').select('*').order('release_date',{ascending:false});if(error){$('releaseList').textContent=error.message;return}const now=Date.now(),future=(data||[]).filter(r=>new Date(r.release_date)>now).sort((a,b)=>new Date(a.release_date)-new Date(b.release_date)),current=future[0]||(data||[])[0];$('currentRelease').innerHTML=current?`<span class="pill">${new Date(current.release_date)>now?'предстоящий':'последний'}</span><br><b>${esc(current.title)}</b>`:'релизов пока нет';$('releaseList').innerHTML=(data||[]).map(r=>`<div class="item">${r.cover_url?`<img src="${esc(r.cover_url)}" onerror="this.style.display='none'" style="width:64px;height:64px;object-fit:cover;float:left;margin-right:10px">`:''}<b>${esc(r.title)}</b><div class="tiny muted">${new Date(r.release_date).toLocaleString('ru-RU')} · ${esc(r.type)} · ${(r.tracklist||[]).length||1} тр.</div><div>${PLATFORM_ORDER.filter(k=>r.platforms?.[k]).map(k=>`<span class="pill">${esc(k)}</span>`).join('')}${r.platforms?.soundcloud?'<span class="pill">full audio</span>':''}</div><div style="clear:both"></div><button class="danger" data-del-release="${r.id}">удалить</button></div>`).join('')||'пока пусто';document.querySelectorAll('[data-del-release]').forEach(b=>b.onclick=async()=>{await db.from('releases').delete().eq('id',b.dataset.delRelease);loadReleases()})}
async function tiktok(url){const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url));if(!r.ok)throw Error('TikTok oEmbed');return r.json()}
$('fetchVisual').onclick=async()=>{const u=$('visualUrl').value.trim();if(!u)return;try{let title='',img='',platform='other',canonical=u;if(/tiktok\.com/i.test(u)){const d=await tiktok(u);title=d.title||d.author_name||'TikTok';img=d.thumbnail_url||'';platform='tiktok';const m=String(d.html||'').match(/cite="([^"]+)"/i);if(m)canonical=m[1]}else{const d=await metadata(u);title=d.ogTitle||d.title||'';img=d.ogImage||d.image?.url||'';platform=/youtu/i.test(u)?'youtube':'other'}$('visualUrl').value=canonical;$('visualTitle').value=title;$('visualPreviewUrl').value=img;$('visualPlatform').value=platform;const e=$('visualPreview');e.classList.remove('hidden');e.innerHTML=(img?`<img src="${esc(img)}" alt="">`:`<div class="ph">no image</div>`)+`<div><b>${esc(title)}</b><div class="muted tiny">${platform}</div></div>`}catch{}};
$('importTikTokAccount').onclick=async()=>{const st=$('tiktokImportStatus');st.textContent='импортирую TikTok…';const{data,error}=await db.functions.invoke('tiktok-import',{body:{}});if(error){st.textContent='нужно один раз подключить TikTok API: '+error.message;return}if(data?.error){st.textContent=data.error;return}st.textContent=`готово · найдено ${data.found||0} · добавлено ${data.added||0} · уже было ${data.skipped||0}`;loadVisuals()};
$('saveVisual').onclick=async()=>{const url=$('visualUrl').value.trim();if(!url)return;const{error}=await db.from('visuals').insert({url,title:$('visualTitle').value.trim()||null,preview_url:$('visualPreviewUrl').value.trim()||null,platform:$('visualPlatform').value,published:true});if(!error){$('visualUrl').value='';$('visualTitle').value='';$('visualPreviewUrl').value='';$('visualPreview').classList.add('hidden');loadVisuals()}};
async function loadVisuals(){const{data,error}=await db.from('visuals').select('*').order('created_at',{ascending:false});$('visualList').innerHTML=error?error.message:(data||[]).map(v=>`<div class="item">${v.preview_url?`<img src="${esc(v.preview_url)}" style="width:54px;height:72px;object-fit:cover;float:left;margin-right:10px">`:''}<b>${esc(v.title||v.platform)}</b><div class="tiny muted">${esc(v.platform)}</div><div style="clear:both"></div><button class="danger deleteSmall" data-del-visual="${v.id}">удалить</button></div>`).join('')||'пока пусто';document.querySelectorAll('[data-del-visual]').forEach(b=>b.onclick=async()=>{const{error}=await db.from('visuals').delete().eq('id',b.dataset.delVisual);if(!error)loadVisuals()})}
db.auth.onAuthStateChange(()=>setSessionUI());setSessionUI();
</script></body></html>
