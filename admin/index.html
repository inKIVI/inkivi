<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>inkivi admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b0b08;--card:#12120f;--ink:#e8e0d2;--muted:#8f887c;--line:#34332d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1080px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}h1{font-size:clamp(34px,7vw,64px);line-height:.9;margin:0;letter-spacing:-.06em}h2{margin:0 0 12px;font-size:18px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{border:1px solid var(--line);padding:18px;background:var(--card)}input,button,select{width:100%;padding:11px;margin:6px 0;background:#0d0d0b;color:var(--ink);border:1px solid #3a3933;font:inherit}button{cursor:pointer}.primary{background:var(--ink);color:#11110e}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.item{border-top:1px solid var(--line);padding:12px 0}.tiny{font-size:11px}.status{margin:8px 0 0;min-height:20px}.danger{border-color:#69433b}.pill{display:inline-block;border:1px solid var(--line);padding:4px 7px;font-size:10px}.top button{width:auto;margin:0}.preview{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;margin:10px 0;padding:10px;border:1px solid var(--line);background:#0d0d0b}.preview img{width:92px;height:92px;object-fit:cover;background:#080806}.preview .ph{width:92px;height:92px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}a{color:inherit}@media(max-width:620px){main{padding:16px}.row{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><main><div class="top"><div><h1>inkivi / admin</h1><div class="muted tiny">закрытая панель управления сайтом</div></div><button id="logout" class="hidden">выйти</button></div><section id="login" class="card"><h2>Вход</h2><input id="email" type="email" autocomplete="username" placeholder="email"><input id="password" type="password" autocomplete="current-password" placeholder="пароль"><button id="loginBtn" class="primary">войти</button><div id="loginStatus" class="status muted"></div></section><div id="app" class="hidden"><div class="grid"><section class="card"><h2>Главная</h2><p class="muted">Автоматически: ближайший будущий релиз, иначе последний вышедший.</p><div id="currentRelease">нет данных</div></section><section class="card"><h2>Добавить релиз</h2><input id="source" value="https://link.rpluslb.ru/eto_leto_" placeholder="BandLink / Spotify / Apple Music"><button id="fetchRelease">подтянуть название и обложку</button><div id="releasePreview" class="preview hidden"></div><div class="row"><input id="title" placeholder="название"><select id="type"><option value="single">single</option><option value="ep">EP</option><option value="album">album</option></select></div><input id="releaseDate" type="datetime-local"><input id="cover" placeholder="ссылка на обложку"><input id="presave" placeholder="presave / smart-link"><button id="saveRelease" class="primary">сохранить релиз</button><div id="releaseStatus" class="status muted"></div></section><section class="card"><h2>Релизы</h2><div id="releaseList" class="muted">загрузка…</div></section><section class="card"><h2>Визуалы</h2><input id="visualUrl" placeholder="TikTok / YouTube URL"><button id="fetchVisual">подтянуть превью</button><div id="visualPreview" class="preview hidden"></div><input id="visualTitle" placeholder="название"><select id="visualPlatform"><option value="tiktok">TikTok</option><option value="youtube">YouTube</option><option value="other">Другое</option></select><input id="visualPreviewUrl" placeholder="preview URL"><button id="saveVisual">добавить визуал</button><div id="visualList" class="muted"></div></section></div></div></main><script>const SUPABASE_URL='https://ytckdpaegunralpxvmlx.supabase.co',SUPABASE_KEY='sb_publishable_oyJmCk-WH3ig_QTJlJh1vQ_wLICx0X0',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function meta(url){const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url));if(!r.ok)throw Error('metadata error');const j=await r.json();return j.data||{}}async function tiktok(url){const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url));if(!r.ok)throw Error('TikTok oEmbed error');return r.json()}function showPreview(id,title,img,sub=''){const e=$(id);e.classList.remove('hidden');e.innerHTML=(img?`<img src="${esc(img)}" alt="">`:`<div class="ph">no image</div>`)+`<div><b>${esc(title||'без названия')}</b><div class="muted tiny">${esc(sub)}</div></div>`}async function setSessionUI(){const{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('logout').classList.toggle('hidden',!session);if(session){loadReleases();loadVisuals()}}$('loginBtn').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=error?error.message:'готово';if(!error)setSessionUI()};$('logout').onclick=async()=>{await db.auth.signOut();setSessionUI()};$('fetchRelease').onclick=async()=>{const u=$('source').value.trim();if(!u)return;$('releaseStatus').textContent='загружаю…';try{const d=await meta(u),title=(d.title||'').replace(/\s*[|—-]\s*(BandLink|RPLUS|RPlus).*$/i,'').trim(),img=d.image?.url||d.logo?.url||'';if(title)$('title').value=title;if(img)$('cover').value=img;if(!$('presave').value)$('presave').value=u;showPreview('releasePreview',title||d.title,img,d.description||d.publisher||'');$('releaseStatus').textContent='данные подтянуты'}catch(e){$('releaseStatus').textContent='не удалось подтянуть автоматически — можно заполнить вручную'}};$('saveRelease').onclick=async()=>{let title=$('title').value.trim(),source=$('source').value.trim(),date=$('releaseDate').value;if((!title||!$('cover').value.trim())&&source){try{const d=await meta(source);title=title||d.title||'';$('title').value=title;if(!$('cover').value&&d.image?.url)$('cover').value=d.image.url}catch{}}if(!title||!date){$('releaseStatus').textContent='нужны название и дата';return}const payload={title,slug:title.toLowerCase().trim().replace(/[^a-zа-я0-9]+/gi,'-').replace(/^-|-$/g,''),release_date:new Date(date).toISOString(),type:$('type').value,cover_url:$('cover').value.trim()||null,source_url:source||null,presave_url:$('presave').value.trim()||source||null,published:true};const{error}=await db.from('releases').upsert(payload,{onConflict:'slug'});$('releaseStatus').textContent=error?error.message:'сохранено';if(!error)loadReleases()};async function loadReleases(){const{data,error}=await db.from('releases').select('*').order('release_date',{ascending:false});if(error){$('releaseList').textContent=error.message;return}const now=Date.now(),future=(data||[]).filter(r=>new Date(r.release_date)>now).sort((a,b)=>new Date(a.release_date)-new Date(b.release_date)),current=future[0]||(data||[])[0];$('currentRelease').innerHTML=current?`<span class="pill">${new Date(current.release_date)>now?'предстоящий':'последний'}</span><br><b>${esc(current.title)}</b>`:'релизов пока нет';$('releaseList').innerHTML=(data||[]).map(r=>`<div class="item">${r.cover_url?`<img src="${esc(r.cover_url)}" style="width:64px;height:64px;object-fit:cover;float:left;margin-right:10px">`:''}<b>${esc(r.title)}</b><div class="tiny muted">${new Date(r.release_date).toLocaleString('ru-RU')} · ${esc(r.type)}</div>${r.source_url?`<div class="tiny"><a href="${esc(r.source_url)}" target="_blank">smart-link</a></div>`:''}<div style="clear:both"></div><button class="danger" data-del-release="${r.id}">удалить</button></div>`).join('')||'пока пусто';document.querySelectorAll('[data-del-release]').forEach(b=>b.onclick=async()=>{await db.from('releases').delete().eq('id',b.dataset.delRelease);loadReleases()})}$('fetchVisual').onclick=async()=>{const u=$('visualUrl').value.trim();if(!u)return;try{let title='',img='',platform='other';if(/tiktok\.com/i.test(u)){const d=await tiktok(u);title=d.title||d.author_name||'TikTok';img=d.thumbnail_url||'';platform='tiktok'}else{const d=await meta(u);title=d.title||'';img=d.image?.url||'';platform=/youtu/i.test(u)?'youtube':'other'}$('visualTitle').value=title;$('visualPreviewUrl').value=img;$('visualPlatform').value=platform;showPreview('visualPreview',title,img,platform)}catch(e){$('visualTitle').value=$('visualTitle').value||'визуал';showPreview('visualPreview',$('visualTitle').value,'','не удалось получить preview')}};$('saveVisual').onclick=async()=>{const url=$('visualUrl').value.trim();if(!url)return;let title=$('visualTitle').value.trim(),preview=$('visualPreviewUrl').value.trim(),platform=$('visualPlatform').value;if(!title||!preview){try{if(/tiktok\.com/i.test(url)){const d=await tiktok(url);title=title||d.title||d.author_name||'TikTok';preview=preview||d.thumbnail_url||'';platform='tiktok'}else{const d=await meta(url);title=title||d.title||'визуал';preview=preview||d.image?.url||''}}catch{}}const{error}=await db.from('visuals').insert({url,title:title||null,preview_url:preview||null,platform,published:true});if(!error){$('visualUrl').value='';$('visualTitle').value='';$('visualPreviewUrl').value='';$('visualPreview').classList.add('hidden');loadVisuals()}};async function loadVisuals(){const{data,error}=await db.from('visuals').select('*').order('created_at',{ascending:false});$('visualList').innerHTML=error?error.message:(data||[]).map(v=>`<div class="item">${v.preview_url?`<img src="${esc(v.preview_url)}" style="width:54px;height:72px;object-fit:cover;float:left;margin-right:10px">`:''}<b>${esc(v.title||v.platform)}</b><div class="tiny muted">${esc(v.platform)}</div><div style="clear:both"></div></div>`).join('')||'пока пусто'}db.auth.onAuthStateChange(()=>setSessionUI());setSessionUI();</script></body></html>
