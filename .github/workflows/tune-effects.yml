name: Tune visual effects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- grain-jitter-tune-v1 -->'
          if marker in s:
              raise SystemExit(0)
          s=s.replace(";refreshGlyphs(timer)","")
          s=s.replace(".panel h2,.loader b,.unit b'",".panel h2,.loader b'")
          s=s.replace("opacity:.34;background-image", "opacity:.48;background-image")
          s=s.replace("filter:contrast(190%) brightness(78%)", "filter:contrast(215%) brightness(82%)")
          s=s.replace("const delay=700+Math.random()*3400", "const delay=520+Math.random()*2500")
          s=s.replace("const amount=.28+Math.random()*.5", "const amount=.42+Math.random()*.62")
          s=s.replace("*(Math.random()*.45)", "*(Math.random()*.62)")
          s=s.replace("45+Math.random()*75", "55+Math.random()*95")
          s=s.replace('</body>', marker+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix countdown layout and strengthen grain jitter"
          git push
