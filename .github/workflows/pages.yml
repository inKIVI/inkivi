name: Deploy gh-pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site from gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Configure GitHub Pages
        id: setup
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        id: upload
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          cd site
          printf 'url=%s\nsetup=%s\nupload=%s\ndeploy=%s\nsource=%s\n' \
            "$PAGE_URL" "$SETUP_OUTCOME" "$UPLOAD_OUTCOME" "$DEPLOY_OUTCOME" "$(git rev-parse HEAD)" \
            > .pages-deployment-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages-deployment-status
          git commit -m 'Record Pages deployment result' || true
          git push origin HEAD:gh-pages

      - name: Require successful deployment
        if: steps.deployment.outcome != 'success'
        run: exit 1
