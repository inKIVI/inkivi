name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build VCR font
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          encoded = ''.join((Path('assets/vcr-font.part01').read_text() + Path('assets/vcr-font.part02').read_text()).split())
          data = base64.b64decode(encoded)
          Path('assets/VCR-OSD-Mono-Cyr.ttf').write_bytes(data)
          print(f'VCR font built: {len(data)} bytes')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
