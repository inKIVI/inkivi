name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build VCR font
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          packed = base64.b64decode(''.join(Path('assets/vcr-font.xz.b64').read_text().split()), validate=True)
          data = lzma.decompress(packed)
          digest = hashlib.sha256(data).hexdigest()
          expected = '696c9cb7cd2a467b003c3cf9ecdb73ee694eac5327a43a3e93d170d5a854b09a'
          if len(data) != 30764 or digest != expected:
              raise SystemExit(f'Bad VCR font: {len(data)} bytes, sha256={digest}')
          Path('assets/VCR-OSD-Mono-Cyr.ttf').write_bytes(data)
          print(f'VCR font OK: {len(data)} bytes, sha256={digest}')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
