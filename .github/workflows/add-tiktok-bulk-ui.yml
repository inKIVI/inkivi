name: Add TikTok bulk import UI
on:
  push:
    paths:
      - '.github/workflows/add-tiktok-bulk-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch admin safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text()
          old='<section class="card"><h2>Визуалы</h2><input id="visualUrl" placeholder="TikTok / YouTube URL">'
          new='<section class="card"><h2>Визуалы</h2><button id="importTikTokAccount" class="primary">импортировать весь TikTok-аккаунт</button><div id="tiktokImportStatus" class="status muted tiny"></div><input id="visualUrl" placeholder="TikTok / YouTube URL">'
          if old not in s: raise SystemExit('visuals section pattern not found')
          s=s.replace(old,new,1)
          marker="$('saveVisual').onclick=async()=>"
          handler="""$('importTikTokAccount').onclick=async()=>{const st=$('tiktokImportStatus');st.textContent='импортирую TikTok…';const{data,error}=await db.functions.invoke('tiktok-import',{body:{}});if(error){st.textContent='нужно один раз подключить TikTok API: '+error.message;return}if(data?.error){st.textContent=data.error;return}st.textContent=`готово · найдено ${data.found||0} · добавлено ${data.added||0} · уже было ${data.skipped||0}`;loadVisuals()};\n"""+marker
          if marker not in s: raise SystemExit('saveVisual marker not found')
          s=s.replace(marker,handler,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git rm .github/workflows/add-tiktok-bulk-ui.yml
          git commit -m 'Add TikTok account import button to admin'
          git push
