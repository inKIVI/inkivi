name: Materialize inkivi site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Replace staging files with tested site
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/inkivi-site.tgz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/inkivi-site.tgz -C .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build new inkivi interactive site'
          git push origin HEAD:gh-pages
