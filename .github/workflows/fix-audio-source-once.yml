name: Fix audio source once
on:
  push:
    paths:
      - .github/workflows/fix-audio-source-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch release audio validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/content-ui.js')
          s=p.read_text()
          old="let scScriptPromise=null,scWidget=null,scUrl='',scReady=false,scDuration=0,scStarted=false,activeMode='',activeButton=null;"
          new="let scScriptPromise=null,scWidget=null,scUrl='',scReady=false,scDuration=0,scStarted=false,activeMode='',activeButton=null,playSeq=0;\nconst scMetaCache=new Map();\nasync function soundcloudMatches(url,title){if(!url)return false;const key=url+'|'+title;if(scMetaCache.has(key))return scMetaCache.get(key);let ok=false;try{const r=await fetch('https://soundcloud.com/oembed?format=json&url='+encodeURIComponent(url));if(r.ok){const j=await r.json(),a=norm(j.title||''),b=norm(title||'');ok=!!(a&&b&&(a===b||a.includes(b)||b.includes(a)))}}catch{}scMetaCache.set(key,ok);return ok}"
          if old not in s: raise SystemExit('global marker not found')
          s=s.replace(old,new,1)
          old2="async function playTrack(title,preview,cover,btn,soundcloud='',scIndex=0){const d=ensureDock();clearActive();activeButton=btn;btn?.classList.add('active');btn?.closest('.releaseCard')?.classList.add('is-active');stopAll();activeButton=btn;btn?.classList.add('active');btn?.closest('.releaseCard')?.classList.add('is-active');setDockMeta(title,cover,soundcloud?'soundcloud · full':'preview');if(soundcloud){try{activeMode='soundcloud';scStarted=false;await prepareSC(soundcloud,Number(scIndex)||0);await new Promise(r=>setTimeout(r,1500));if(scStarted)return;throw new Error('soundcloud did not start')}catch(e){console.warn('SoundCloud fallback:',e)}}if(!preview){d.querySelector('.dockLabel').textContent='audio недоступно';d._state(false);return}activeMode='preview';const a=d.querySelector('audio');a.src=preview;a.dataset.url=preview;try{await a.play();d._state(true)}catch{}}"
          new2="async function playTrack(title,preview,cover,btn,soundcloud='',scIndex=0){const myPlay=++playSeq,d=ensureDock();clearActive();activeButton=btn;btn?.classList.add('active');btn?.closest('.releaseCard')?.classList.add('is-active');stopAll();activeButton=btn;btn?.classList.add('active');btn?.closest('.releaseCard')?.classList.add('is-active');setDockMeta(title,cover,soundcloud?'проверка audio…':'preview');if(soundcloud){const valid=await soundcloudMatches(soundcloud,title);if(myPlay!==playSeq)return;if(!valid){console.warn('SoundCloud source does not match track:',title,soundcloud);soundcloud=''}else{d.querySelector('.dockLabel').textContent='soundcloud · full';try{activeMode='soundcloud';scStarted=false;await prepareSC(soundcloud,Number(scIndex)||0);if(myPlay!==playSeq){try{scWidget?.pause()}catch{}return}await new Promise(r=>setTimeout(r,1500));if(myPlay!==playSeq){try{scWidget?.pause()}catch{}return}if(scStarted)return;throw new Error('soundcloud did not start')}catch(e){console.warn('SoundCloud fallback:',e)}}}if(myPlay!==playSeq)return;if(!preview){d.querySelector('.dockLabel').textContent='audio недоступно';d._state(false);return}activeMode='preview';d.querySelector('.dockLabel').textContent='preview';const a=d.querySelector('audio');a.src=preview;a.dataset.url=preview;try{await a.play();if(myPlay===playSeq)d._state(true);else a.pause()}catch{}}"
          if old2 not in s: raise SystemExit('playTrack marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check assets/content-ui.js
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/fix-audio-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content-ui.js .github/workflows/fix-audio-source-once.yml
          git commit -m "Validate SoundCloud source per release and cancel stale playback"
          git push