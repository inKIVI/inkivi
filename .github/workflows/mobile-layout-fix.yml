name: Apply mobile layout fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- mobile-layout-fix-v1 -->'
          if marker in s:
              raise SystemExit(0)

          s = s.replace(
              '  .view{position:relative;inset:auto}\n',
              '  .view{position:relative;inset:auto}\n  .view.off{display:none}\n'
          )
          s = s.replace(
              '  .zones{\n    grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(260px,44vh));\n    padding:8px;gap:8px;\n  }\n',
              '  .zones{\n    grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:clamp(260px,72vw,360px);\n    min-height:0;padding:8px;gap:8px;\n  }\n  .zone{height:auto;min-height:0}\n'
          )
          s = s.replace(
              '  .zoneMedia{inset:54px 22px 92px}\n',
              '  .zoneMedia{inset:42px 18px 78px;overflow:hidden}\n  .zoneMedia img{width:auto;height:auto;max-width:88%;max-height:88%;object-position:center center}\n  .zoneCopy{left:18px;right:18px;bottom:16px}\n  .zoneIndex{top:20px;right:18px}\n'
          )
          s = s.replace(
              'draggable="false">',
              'draggable="false" onerror="this.hidden=true">'
          )
          s = s.replace('</body>', marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile menu layout"
          git push
