<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00184c">
  <meta name="description" content="Официальный сайт inkivi — релизы, музыка и визуалы.">
  <title>inkivi</title>
  <link rel="preload" href="./assets/VCR-OSD-Mono-Cyr.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./assets/site.css?v=20260822a">
  <link rel="stylesheet" href="./assets/cd-refine.css?v=20260822a">
</head>
<body>
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loaderInner">
      <strong>inkivi</strong>
      <span class="bootTrack" aria-hidden="true"><i></i></span>
      <small id="loaderStatus">загрузка данных</small>
    </div>
  </div>

  <div class="stage">
    <section class="view start" id="start" aria-labelledby="siteTitle">
      <div class="hero">
        <div class="eyebrow" id="releaseMode">ближайший релиз</div>
        <h1 id="siteTitle">inkivi</h1>
        <div class="release" id="releaseTitle">предстоящий релиз</div>
        <img class="heroReleaseCover vcr-clean" id="heroReleaseCover" alt="" hidden>
        <div class="date" id="releaseDateLabel">дата уточняется</div>
        <div class="timer" id="timer" aria-label="До релиза"></div>
        <button class="heroPlayStrip" id="heroPlayStrip" type="button" hidden></button>
        <div class="actions">
          <a class="btn primary" id="presave" aria-disabled="true">сделать пресейв</a>
          <button class="btn" id="enter" type="button">войти</button>
        </div>
      </div>
    </section>

    <main class="view menu off" id="menu">
      <section class="zones" aria-label="Разделы сайта">
        <button class="zone visuals" type="button" data-panel="визуалы">
          <span class="zoneSkin"></span><span class="zoneIndex">01</span>
          <span class="zoneMedia vcr-clean"><img id="visualsZoneImage" alt="" hidden><span class="zonePlaceholder">VIS</span></span>
          <span class="zoneCopy"><strong class="zoneTitle">визуалы</strong><span class="zoneMeta">TikTok / видео</span></span>
        </button>
        <button class="zone music" type="button" data-panel="релизы">
          <span class="zoneSkin"></span><span class="zoneIndex">02</span>
          <span class="zoneMedia vcr-clean"><img id="releasesZoneImage" alt="" hidden><span class="zonePlaceholder">CD</span></span>
          <span class="zoneCopy"><strong class="zoneTitle">релизы</strong><span class="zoneMeta">музыка / ссылки</span></span>
        </button>
        <button class="zone back" id="back" type="button">
          <span class="zoneSkin"></span><span class="zoneIndex">03</span>
          <span class="zoneMedia vcr-clean"><span class="zonePlaceholder zoneDoor">←</span></span>
          <span class="zoneCopy"><strong class="zoneTitle">назад</strong><span class="zoneMeta">к экрану релиза</span></span>
        </button>
        <button class="zone game" type="button" data-panel="игра">
          <span class="zoneSkin"></span><span class="zoneIndex">04</span>
          <span class="zoneMedia vcr-clean"><span class="zonePlaceholder">PLAY</span></span>
          <span class="zoneCopy"><strong class="zoneTitle">игра</strong><span class="zoneMeta">скоро</span></span>
        </button>
      </section>
    </main>
  </div>

  <div class="fade" id="fade" aria-hidden="true"></div>
  <section class="panel" id="panel" aria-modal="true" role="dialog" aria-labelledby="panelTitle" aria-hidden="true">
    <div class="panelHead">
      <h2 id="panelTitle">раздел</h2>
      <button class="close" id="close" type="button" aria-label="Закрыть раздел">×</button>
    </div>
    <div class="content" id="panelText"></div>
  </section>

  <div class="audioDock" id="globalAudioDock" hidden>
    <audio preload="metadata"></audio>
    <iframe class="scEngine" title="SoundCloud player" allow="autoplay" tabindex="-1"></iframe>
    <button class="dockPlay" type="button" aria-label="Воспроизвести"></button>
    <img class="dockCover vcr-clean" alt="" hidden>
    <div class="dockMain">
      <div class="dockTop"><b class="dockTitle">—</b><span class="dockLabel">audio</span></div>
      <button class="dockProgress" type="button" aria-label="Перемотать"><i></i></button>
      <div class="dockBottom">
        <span class="dockTime">0:00 / 0:00</span>
        <label class="dockVolume"><span aria-hidden="true">VOL</span><input type="range" min="0" max="100" step="1" value="82" aria-label="Громкость"></label>
      </div>
    </div>
    <button class="dockClose" type="button" aria-label="Закрыть плеер">×</button>
  </div>

  <noscript><div class="noScript">Для загрузки релизов требуется JavaScript.</div></noscript>
  <script src="./assets/app.js?v=20260822a" defer></script>
  <script src="./assets/vcr-effect.js?v=20260822a" defer></script>
</body>
</html>
