<style>

.start{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) clamp(18px,4vw,54px) max(24px,env(safe-area-inset-bottom));z-index:3}.hero{position:relative;z-index:2;width:min(1100px,100%);text-align:center}.eyebrow{font-size:clamp(9px,.8vw,12px);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}h1{margin:clamp(18px,3vh,34px) 0 16px;font-size:clamp(76px,17vw,230px);line-height:.76;letter-spacing:-.075em}.release{font-size:clamp(15px,2vw,28px);letter-spacing:.18em;text-transform:uppercase}.date{margin-top:9px;font-size:clamp(10px,.8vw,13px);letter-spacing:.19em;color:var(--muted);text-transform:uppercase}.timer{display:grid;grid-template-columns:repeat(4,minmax(74px,150px));justify-content:center;gap:clamp(14px,2.3vw,34px);margin:clamp(28px,5vh,54px) 0}.unit{position:relative}.unit:not(:last-child):after{content:"";position:absolute;right:calc(clamp(14px,2.3vw,34px)/-2);top:10%;bottom:10%;width:1px;background:linear-gradient(transparent,var(--line),transparent)}.unit b{display:block;font-size:clamp(38px,6vw,86px);font-weight:300;line-height:.9}.unit span{display:block;margin-top:9px;font-size:clamp(8px,.65vw,10px);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{min-width:min(220px,42vw);padding:15px 22px;border:1px solid var(--line);background:rgba(14,14,12,.68);text-decoration:none;text-transform:uppercase;letter-spacing:.18em;font-size:10px;cursor:pointer;transition:transform .25s var(--ease),background .25s,color .25s}.btn:hover{transform:translateY(-3px)}.btn.primary{background:var(--ink);color:#151512}
.menu{z-index:2;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;grid-template-rows:auto 1fr;gap:18px}.top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:clamp(24px,2.2vw,38px);font-weight:700;letter-spacing:-.03em}.brand small{display:block;margin-top:5px;font-size:8px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.hint{font-size:9px;line-height:1.6;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}.zones{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr 1fr 1.2fr;grid-template-rows:1fr 1fr;gap:clamp(10px,1.2vw,20px);min-height:0}.zone{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));cursor:pointer;text-align:left;isolation:isolate;transition:flex .7s var(--ease),transform .45s var(--ease),border-color .3s,filter .3s}.zone:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(161,137,82,.16),transparent 30%),linear-gradient(180deg,transparent,rgba(0,0,0,.45));z-index:-1;transition:transform .8s var(--ease),opacity .4s}.zone:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.25)}.zone:hover:before{transform:scale(1.06)}.zone strong{position:absolute;left:clamp(18px,2vw,34px);bottom:clamp(24px,3vh,42px);font-size:clamp(30px,4.2vw,72px);line-height:.86;letter-spacing:-.05em;text-transform:lowercase;z-index:3}.zone span{position:absolute;left:clamp(18px,2vw,34px);bottom:clamp(10px,1.3vh,18px);font-size:clamp(7px,.65vw,10px);letter-spacing:.19em;text-transform:uppercase;color:var(--muted);z-index:3}.visuals{grid-row:1/3}.game{grid-column:3;grid-row:1/3}.back{grid-column:2;grid-row:1}.music{grid-column:2;grid-row:2}.art{position:absolute;inset:0;display:grid;place-items:center}.tv{width:min(58%,520px);aspect-ratio:1.25;border:clamp(10px,1.2vw,18px) solid #292720;border-radius:18px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px),radial-gradient(circle,#34392f,#10130f 67%);box-shadow:0 28px 65px rgba(0,0,0,.5);transition:transform .7s var(--ease)}.pc{width:min(62%,560px);height:45%;border:clamp(10px,1.2vw,18px) solid #292720;background:#081009;box-shadow:0 28px 65px rgba(0,0,0,.5);transition:transform .7s var(--ease)}.pc:after{content:"inkivi.exe";position:absolute;left:18px;top:16px;font:clamp(10px,.9vw,14px) monospace;letter-spacing:.15em;text-transform:uppercase;color:#a5ac98}.disc{width:min(30%,230px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#8f866d,#35332b,#a39a7c,#2a2b25,#8f866d);box-shadow:0 24px 54px rgba(0,0,0,.48);transition:transform .7s var(--ease)}.disc:after{content:"";position:absolute;inset:40%;border-radius:50%;background:#0c0c0a;border:3px solid #aaa18e}.door{width:min(24%,180px);height:68%;border:clamp(8px,1vw,14px) solid #1c1b17;background:linear-gradient(100deg,#4e4339,#29251f 55%,#171613);box-shadow:16px 22px 46px rgba(0,0,0,.5);transition:transform .7s var(--ease)}.door:after{content:"";position:absolute;right:11%;top:52%;width:10px;height:10px;border-radius:50%;background:#beb5a3}.zone:hover .tv,.zone:hover .pc,.zone:hover .disc,.zone:hover .door{transform:scale(1.06)}
.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:stretch;background:#0b0b09;opacity:0;visibility:hidden;pointer-events:none;transform:scale(.98);transition:opacity .55s var(--ease),transform .65s var(--ease),visibility .55s}.panel.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}.panelInner{min-height:100svh;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) clamp(20px,5vw,80px) max(24px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at 70% 20%,rgba(127,79,56,.14),transparent 28%),linear-gradient(180deg,#171713,#0b0b09)}.panelHead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.panel h2{margin:0;font-size:clamp(54px,11vw,170px);line-height:.78;letter-spacing:-.07em;text-transform:lowercase}.close{border:1px solid var(--line);background:rgba(255,255,255,.03);width:52px;height:52px;border-radius:50%;font-size:30px;cursor:pointer}.content{align-self:end;margin-top:30px;padding-top:28px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(24px,5vw,90px)}.content p{margin:0;font-size:clamp(17px,2vw,30px);line-height:1.35;max-width:36ch}.content aside{color:var(--muted);font-size:clamp(12px,1vw,15px);line-height:1.7}.transition{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#070706;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}.transition.on{opacity:1;visibility:visible}.transitionDoor{width:min(340px,62vw);height:min(600px,72vh);border:12px solid #1b1a17;background:linear-gradient(100deg,#4f4439,#29251f 56%,#171613);transform-origin:left center;box-shadow:0 0 80px rgba(0,0,0,.8)}.transition.on .transitionDoor{animation:doorOpen 1.25s var(--ease) forwards}@keyframes doorOpen{0%{transform:perspective(1000px) rotateY(0) scale(.96)}65%{transform:perspective(1000px) rotateY(-74deg) scale(1.04)}100%{transform:perspective(1000px) rotateY(-84deg) scale(1.14);opacity:0}}
@media(max-width:900px){body{overflow:auto}.stage{position:relative;min-height:100dvh;overflow:visible}.view{position:relative;inset:auto}.start{min-height:100dvh}.menu{min-height:100dvh}.zones{grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(260px,42vh))}.visuals,.game,.back,.music{grid-column:auto;grid-row:auto}.zone strong{font-size:clamp(34px,7vw,62px)}.content{grid-template-columns:1fr}.panel{position:fixed}}
@media(max-width:620px){.start{padding-left:16px;padding-right:16px}h1{font-size:24vw}.timer{grid-template-columns:repeat(2,minmax(90px,120px));gap:22px 28px}.unit:nth-child(2):after{display:none}.actions{flex-direction:column;align-items:stretch}.btn{width:100%;min-width:0}.menu{padding:14px;gap:14px}.hint{display:none}.zones{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(250px,42vh));gap:12px}.zone{min-height:250px}.zone strong{font-size:clamp(42px,15vw,78px)}.tv{width:48%}.pc{width:52%;height:38%}.disc{width:24%}.door{width:18%}.panel h2{font-size:20vw}.close{width:46px;height:46px}.content{align-self:start;padding-top:20px}.content p{font-size:20px}}
@media(min-width:1800px){.menu{padding:28px 36px}.zones{gap:24px}.zone strong{font-size:78px}.brand{font-size:42px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="stage">
<section class="view start" id="start"><div class="hero"><div class="eyebrow">ближайший релиз</div><h1>inkivi</h1><div class="release">предстоящий релиз</div><div class="date">01 сентября 2026</div><div class="timer" id="timer"></div><div class="actions"><a class="btn primary" href="#">сделать пресейв</a><button class="btn" id="enter">войти</button></div></div></section>
<main class="view menu off" id="menu"><header class="top"><div class="brand">inkivi<small>главное меню</small></div><div class="hint">выбери раздел<br>и нажми</div></header><section class="zones"><button class="zone visuals" data-panel="визуалы"><i class="art"><i class="tv"></i></i><strong>визуалы</strong><span>TikTok / видео</span></button><button class="zone back" id="back"><i class="art"><i class="door"></i></i><strong>назад</strong><span>к экрану релиза</span></button><button class="zone music" data-panel="релизы"><i class="art"><i class="disc"></i></i><strong>релизы</strong><span>музыка / ссылки</span></button><button class="zone game" data-panel="игра"><i class="art"><i class="pc"></i></i><strong>игра</strong><span>запустить</span></button></section></main>
</div>
<div class="transition" id="transition"><div class="transitionDoor"></div></div>
<section class="panel" id="panel"><div class="panelInner"><div class="panelHead"><h2 id="panelTitle">раздел</h2><button class="close" id="close" aria-label="закрыть">×</button></div><div class="content"><p id="panelText">Здесь будет содержимое раздела.</p><aside>Контент будет подставляться из конфигурации: ссылки, обложки, видео и игра. Сейчас это полноэкранный адаптивный каркас.</aside></div></div></section>
<script>
const target=new Date('2026-09-01T00:00:00');const timer=document.getElementById('timer');function tick(){const d=Math.max(0,target-new Date()),a=[Math.floor(d/86400000),Math.floor(d/3600000)%24,Math.floor(d/60000)%60,Math.floor(d/1000)%60],n=['дней','часов','минут','секунд'];timer.innerHTML=a.map((v,i)=>`<div class="unit"><b>${String(v).padStart(2,'0')}</b><span>${n[i]}</span></div>`).join('')}tick();setInterval(tick,1000);
const start=document.getElementById('start'),menu=document.getElementById('menu'),tr=document.getElementById('transition');document.getElementById('enter').onclick=()=>{tr.classList.add('on');setTimeout(()=>{start.classList.add('off');menu.classList.remove('off')},520);setTimeout(()=>tr.classList.remove('on'),1280)};document.getElementById('back').onclick=()=>{menu.classList.add('off');start.classList.remove('off')};
const panel=document.getElementById('panel'),title=document.getElementById('panelTitle'),text=document.getElementById('panelText');const copy={визуалы:'Здесь будут крупные превью визуалов, TikTok и видео с плавным перелистыванием.',релизы:'Здесь будут обложки, CD, BandLink и ссылки на музыкальные площадки.',игра:'Здесь будет полноэкранный запуск браузерной игры или Unity WebGL.'};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{title.textContent=b.dataset.panel;text.textContent=copy[b.dataset.panel];panel.classList.add('on')});function closePanel(){panel.classList.remove('on')}document.getElementById('close').onclick=closePanel;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
</script>
</body>
