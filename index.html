<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b09">
<title>inkivi</title>
<meta name="description" content="Официальный сайт inkivi">
<style>
:root{--bg:#0b0b09;--paper:#ded8cc;--muted:#8e897f;--line:rgba(255,255,255,.11);--rust:#7d5744;--olive:#62604f}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100svh;min-height:100dvh;background:radial-gradient(circle at 50% 15%,rgba(154,139,99,.14),transparent 26%),linear-gradient(180deg,#171713,#090908);color:var(--paper);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,a{font:inherit;color:inherit}.screen{min-height:100svh;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));display:grid;place-items:center}.hero{width:min(920px,100%);text-align:center}.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}h1{margin:18px 0 14px;font-size:clamp(76px,18vw,190px);line-height:.78;letter-spacing:-.075em;text-transform:lowercase}.release{font-size:clamp(15px,2.5vw,24px);letter-spacing:.18em;text-transform:uppercase}.date{margin-top:8px;font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.timer{display:grid;grid-template-columns:repeat(4,minmax(62px,120px));justify-content:center;gap:18px;margin:34px 0}.unit{position:relative}.unit:not(:last-child):after{content:"";position:absolute;right:-9px;top:8%;bottom:8%;width:1px;background:linear-gradient(transparent,var(--line),transparent)}.unit b{display:block;font-size:clamp(34px,7vw,66px);font-weight:300;line-height:1}.unit span{display:block;margin-top:7px;font-size:9px;letter-spacing:.17em;color:var(--muted);text-transform:uppercase}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{min-width:190px;padding:14px 20px;border:1px solid var(--line);background:rgba(15,15,13,.72);text-decoration:none;text-transform:uppercase;letter-spacing:.16em;font-size:10px;cursor:pointer}.btn.primary{background:var(--paper);color:#161613}.room{display:none;min-height:100svh;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,rgba(157,143,105,.1),transparent 30%),linear-gradient(180deg,#1a1a16,#0b0b09)}.room.on{display:block}.top{display:flex;justify-content:space-between;align-items:flex-start;max-width:1100px;margin:auto}.brand{font-size:28px;font-weight:700}.brand small{display:block;margin-top:5px;font-size:8px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.grid{max-width:1100px;margin:58px auto 0;display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:260px 260px;gap:14px}.item{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.01));cursor:pointer;text-align:left}.item:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(137,119,79,.13),transparent 30%),linear-gradient(180deg,transparent,rgba(0,0,0,.36))}.item strong{position:absolute;left:18px;bottom:17px;font-size:22px;text-transform:lowercase;z-index:2}.item span{position:absolute;left:18px;bottom:7px;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);z-index:2}.visuals{grid-row:1/3}.game{grid-column:3;grid-row:1/3}.back{grid-column:2}.music{grid-column:2}.icon{position:absolute;inset:0;display:grid;place-items:center}.tv{width:58%;aspect-ratio:1.2;border:12px solid #2a2822;border-radius:10px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px),radial-gradient(circle,#363a30,#10120f 65%);box-shadow:0 20px 40px rgba(0,0,0,.5)}.pc{width:60%;height:46%;border:12px solid #2a2822;background:#081009;box-shadow:0 20px 40px rgba(0,0,0,.5)}.pc:after{content:"игра";position:absolute;left:18px;top:16px;font:12px monospace;letter-spacing:.16em;text-transform:uppercase;color:#9aa08d}.disc{width:34%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#847d68,#3c392f,#9c9275,#292b25,#847d68);box-shadow:0 18px 32px rgba(0,0,0,.5)}.disc:after{content:"";position:absolute;inset:40%;border-radius:50%;background:#0c0c0a;border:3px solid #aaa18e}.door{width:32%;height:70%;border:9px solid #1d1b17;background:linear-gradient(100deg,#4b4238,#28241f 55%,#171613);box-shadow:14px 18px 34px rgba(0,0,0,.5)}.door:after{content:"";position:absolute;right:12%;top:52%;width:10px;height:10px;border-radius:50%;background:#bdb5a3}.panel{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.82);z-index:10}.panel.on{display:grid}.panelbox{width:min(720px,100%);max-height:86svh;overflow:auto;border:1px solid var(--line);background:#11110f;padding:24px}.panelhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.panel h2{margin:0;font-size:clamp(40px,8vw,72px);line-height:.9}.close{border:0;background:none;font-size:38px;color:var(--muted);cursor:pointer}.card{margin-top:20px;padding:18px;border:1px solid var(--line);color:#b4aea5;line-height:1.6}.transition{position:fixed;inset:0;display:none;place-items:center;background:#070706;z-index:20}.transition.on{display:grid}.transition .door{width:min(300px,64vw);height:min(520px,70vh);animation:open 1.2s cubic-bezier(.22,.8,.25,1) forwards}@keyframes open{0%{transform:scale(.94)}55%{transform:scale(1.02)}100%{transform:scale(1.4);opacity:0}}
@media(max-width:760px){h1{font-size:24vw}.timer{grid-template-columns:repeat(2,94px);gap:20px 28px}.unit:nth-child(2):after{display:none}.room{overflow:auto}.grid{margin-top:34px;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,190px);gap:12px}.visuals,.game,.back,.music{grid-column:1;grid-row:auto}.tv{width:42%}.pc{width:48%}.disc{width:24%}.door{width:22%}.item strong{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="screen" id="start"><div class="hero"><div class="eyebrow">ближайший релиз</div><h1>inkivi</h1><div class="release">предстоящий релиз</div><div class="date">01 сентября 2026</div><div class="timer" id="timer"></div><div class="actions"><a class="btn primary" href="#">сделать пресейв</a><button class="btn" id="enter">войти</button></div></div></section>
<div class="transition" id="transition"><div class="door"></div></div>
<main class="room" id="room"><div class="top"><div class="brand">inkivi<small>главное меню</small></div></div><div class="grid"><button class="item visuals" data-panel="визуалы"><i class="icon"><i class="tv"></i></i><strong>визуалы</strong><span>TikTok / видео</span></button><button class="item back" id="back"><i class="icon"><i class="door"></i></i><strong>назад</strong><span>к релизу</span></button><button class="item music" data-panel="релизы"><i class="icon"><i class="disc"></i></i><strong>релизы</strong><span>музыка / ссылки</span></button><button class="item game" data-panel="игра"><i class="icon"><i class="pc"></i></i><strong>игра</strong><span>запустить</span></button></div></main>
<section class="panel" id="panel"><div class="panelbox"><div class="panelhead"><h2 id="panelTitle">раздел</h2><button class="close" id="close">×</button></div><div class="card" id="panelText">Здесь будет содержимое раздела.</div></div></section>
<script>
const target=new Date('2026-09-01T00:00:00');const timer=document.getElementById('timer');function tick(){const d=Math.max(0,target-new Date()),a=[Math.floor(d/86400000),Math.floor(d/3600000)%24,Math.floor(d/60000)%60,Math.floor(d/1000)%60],n=['дней','часов','минут','секунд'];timer.innerHTML=a.map((v,i)=>`<div class="unit"><b>${String(v).padStart(2,'0')}</b><span>${n[i]}</span></div>`).join('')}tick();setInterval(tick,1000);
const start=document.getElementById('start'),room=document.getElementById('room'),tr=document.getElementById('transition');document.getElementById('enter').onclick=()=>{tr.classList.add('on');setTimeout(()=>{start.style.display='none';room.classList.add('on')},600);setTimeout(()=>tr.classList.remove('on'),1250)};document.getElementById('back').onclick=()=>{room.classList.remove('on');start.style.display='grid'};
const panel=document.getElementById('panel'),title=document.getElementById('panelTitle'),text=document.getElementById('panelText');document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{title.textContent=b.dataset.panel;text.textContent=b.dataset.panel==='визуалы'?'Здесь будут визуалы и ссылки на TikTok.':b.dataset.panel==='релизы'?'Здесь будут релизы, обложки и ссылки на площадки.':'Здесь будет запуск браузерной игры.';panel.classList.add('on')});document.getElementById('close').onclick=()=>panel.classList.remove('on');panel.onclick=e=>{if(e.target===panel)panel.classList.remove('on')};
</script>
</body>
</html>
